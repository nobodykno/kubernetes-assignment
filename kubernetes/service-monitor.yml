apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: microservices-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - worker
          - stats

  namespaceSelector:
    matchNames:
      - microservices

  endpoints:
    - port: http
      path: /metrics
      interval: 15s