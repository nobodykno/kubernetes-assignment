apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: kubernetes-assignment-worker:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          envFrom:
            - configMapRef:
                name: app-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker

spec:
  type: ClusterIP

  selector:
    app: worker

  ports:
    - name: http
      port: 3001
      targetPort: 3001